version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ine-mcp:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - INDEX_DIR=/app/data
      - LOG_LEVEL=INFO
    volumes:
      # Mount data directory to persist FAISS index
      - ./data:/app/data
      # Mount source code for development
      - ./ine_mcp:/app/ine_mcp
    stdin_open: true
    tty: true
    command: uv run python -m ine_mcp.server

volumes:
  redis_data:
