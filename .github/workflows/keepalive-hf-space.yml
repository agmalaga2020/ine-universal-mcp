name: Keep HF Space Alive

on:
  schedule:
    # Every 6 hours to keep the Space warm (HF Free Tier sleeps after 48h)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up HF Space
        run: |
          echo "Pinging HF Space to prevent cold start..."
          curl -I --max-time 10 https://Blbllbbdkdjbdjf-ine-universal-mcp.hf.space/health || echo "⚠️  Ping failed (Space might be building or down)"
          
      - name: Verify Space is responding
        run: |
          response=$(curl -s --max-time 15 https://Blbllbbdkdjbdjf-ine-universal-mcp.hf.space/health || echo "failed")
          if [[ "$response" == *"healthy"* ]]; then
            echo "✓ Space is alive and healthy"
          else
            echo "⚠️  Space responded but health check inconclusive: $response"
          fi
