services:
  - type: web
    name: ine-universal-mcp
    runtime: docker
    rootDir: ine_mcp_python
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: INDEX_DIR
        value: /app/data
      - key: LOG_LEVEL
        value: info
      # Redis is optional - will use in-memory fallback if not configured
      # - key: REDIS_URL
      #   value: redis://localhost:6379
    healthCheckPath: /health
